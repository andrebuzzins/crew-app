# Ogni giorno: tiene sveglio il database e cancella le segnalazioni scadute (7 giorni).
name: Tieni sveglio Supabase

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pulizia segnalazioni scadute
        run: |
          curl -sf -X POST "https://qkitqircjvavwuybozty.supabase.co/rest/v1/rpc/cleanup_segnalazioni" \
            -H "apikey: sb_publishable_oXLRqqlztAVDYNHngpHAUQ__BL3Fj_a" \
            -H "Content-Type: application/json" -d '{}'
